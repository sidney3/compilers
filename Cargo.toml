[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
proc-macro2 = { version = "1.0.74", features = ["span-locations"] }
quote = { version = "1.0.35" }
syn = { version = "2.0.81", features = ["full"] }
smallvec = { version = "1" }
itertools = { version = "0.12" }
thiserror = { version = "2" }
lasso = { version = "0.7.3" }
log = { version = "0.4.33" }
either = { version = "1" }
annotate-snippets = { version = "0.12.16" }
strum = { version = "0.28.0", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }
env_logger = {  version = "0.11.11" }
heck = { version = "0.5.0" }
nonempty = { version =  "0.10" }

lox_core = { path = "crates/lox_core" }
lox_derive = { path = "crates/lox_derive" }
lexer = { path = "crates/lexer" }
lparse = { path = "crates/lparse" }

[package]
name = "lox_rs"
version = "0.1.0"
edition = "2024"


[build-dependencies]
lparse = { path = "crates/lparse" }

[dependencies]
smallvec.workspace = true
itertools.workspace = true
thiserror.workspace = true
lasso.workspace = true
log.workspace = true
either.workspace = true
annotate-snippets.workspace = true
strum.workspace = true
clap.workspace = true
env_logger.workspace = true
quote.workspace = true
nonempty.workspace = true

lox_derive.workspace = true
lox_core.workspace = true
lexer.workspace = true
lparse.workspace = true

[features]
stress_test_gc = []


[lints.rust]
warnings = "deny"
